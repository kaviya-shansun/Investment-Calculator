
<div *ngIf="investdata.annualData.length > 0; else fallback">
<table>
    <thead>
        <tr>
            <th>Year</th>
            <th>Investment Value</th>
            <th>Interest(Year)</th>
            <th>Total Interest</th>
            <th>Invested Capital</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let data of investdata.annualData">
             <td>{{ data.year }}</td>
            <td>{{ data.valueEndOfYear | currency}}</td>
            <td>{{ data.interest | currency}}</td>
            <td>{{ data.totalInterest | currency}}</td>
            <td>{{ data.totalAmountInvested | currency}}</td>
        </tr>
    </tbody>
</table>
</div>
<ng-template #fallback>
<p>Please enter some values and press Calculate!</p>
</ng-template>
